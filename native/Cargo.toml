[package]
name = "pokeidle-manager-native"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
build = "build.rs"
description = "Native Slint desktop port of Pokeidle Manager"

[features]
default = []
mobile-local-server = []

[build-dependencies]
slint-build = "=1.18.1"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2"] }
futures-util = "0.3"
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
open = "5"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
