name: Native Slint compile
# Only run this workflow when explicitly requested.
on:
  workflow_dispatch:

jobs:
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check native desktop and Slint markup
        run: cargo check --manifest-path native/Cargo.toml
      - name: Execute native Rust regression tests
        run: cargo test --manifest-path native/Cargo.toml -- --test-threads=2
